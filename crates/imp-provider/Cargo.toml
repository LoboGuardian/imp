[package]
name = "imp-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
imp-core = { version = "0.1.0", path = "../imp-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "rt-multi-thread"] }
